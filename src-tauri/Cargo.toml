[package]
name = "vnm-player"
version = "0.1.0"
edition = "2021"

[lib]
name = "vnm_player_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "ogg", "vorbis", "pcm"] }
cpal = "0.15"
ringbuf = "0.4"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }
